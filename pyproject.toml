[project]
name = "agent-hermes-and-async-batch-tasks"
version = "0.1.0"
description = "Agent Hermes and Async Batch Tasks"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai-agents>=0.19.0",
]

[project.scripts]
hermes = "hermes.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
