name: Hermes 跨平台发布构建

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-build:
    name: ${{ matrix.name }} 发布门禁
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: macos-arm64
          - name: Linux x64
            runner: ubuntu-24.04
            target: linux-x64
          - name: Windows x64
            runner: windows-2025
            target: win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --locked --group dev
      - name: 运行 Python 与 Node 质量门禁
        run: |
          uv run pytest
          npm run typecheck
          npm run lint
          npm run format:check
      - name: 发布前运行跨语言契约与生命周期测试（#13）
        run: npm run test:all
      - name: clean build 与冻结 Server 握手验证
        shell: bash
        run: npm run build:release -- ${{ matrix.target }}
      - name: 上传候选发布产物
        uses: actions/upload-artifact@v4
        with:
          name: hermes-${{ matrix.target }}
          path: dist/release/${{ matrix.target }}
          if-no-files-found: error
